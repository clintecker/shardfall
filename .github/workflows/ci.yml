name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Static checks
        run: npm run check

      - name: Unit tests and game simulations
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload the built game
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: shardfall-dist
          path: dist/
          if-no-files-found: error
